[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-contracts-observability-demo"
version = "0.1.0"
description = "Synthetic, dependency-free reference implementation for executable data contracts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Rohit Nomula" }
]
keywords = [
  "data-engineering",
  "data-contracts",
  "observability",
  "lineage",
  "data-quality"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database"
]
dependencies = []

[project.scripts]
data-observer = "data_observer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["data_observer"]
